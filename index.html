<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VulpeSearch</title>
  <meta name="author" content="Azra://Garf" />
 <link rel="icon" href="favicon.png"/>
 <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="top">
  <button id="menu-side">&#8801; Settings</button>
  <button id="but-nig">&#9432; About</button>
 </div>
 <div id="search">
  <h2 id="titulo"></h2><br />
 <form id="srch">
  <input type="text" name="srchi" id="srchi" placeholder="Search across the web..." aria-label="Search input"/>
  <button id="srchb" type="submit">🔎</button>
 </form>
 </div>
 <div id="settings">
  <label for="brow">Browser Engine</label>
  <select name="brow" id="brow">
   <option value="Google">Google</option>
   <option value="Brave">Brave</option>
   <option value="StartPage">StartPage</option>
   <option value="DuckDuckGo">DuckDuckGo</option>
  </select>
  <hr />
  <button id="toggle-theme">🌙 Toggle Theme</button>
  <hr />
  <label for="bg-select">Background</label>
  <select id="bg-select">
   <option value="default">Default (Light & Dark)</option>
   <option value="bg1.jpg">Background 1</option>
   <option value="bg2.jpg">Background 2</option>
   <option value="bg3.jpg">Background 3</option>
   <option value="bg4.jpg">Background 4</option>
   <option value="bg5.jpg">Background 5</option>
   <option value="bg6.jpeg">Background 6</option>
   <option value="bg7.jpeg">Background 7</option>
   <option value="bg8.jpeg">Background 8</option>
   <option value="bg9.jpeg">Background 9</option>
  </select>
 </div>
 <div id="about">
  <p>Page by Azra://Garf</p>
  <hr />
  <p>Submitted with GitHub Pages</p>
  <hr />
  <p>Vulpe://Search v2.0.1a</p>
 </div>
 <script src="main.js"></script>
</body>
</html>
